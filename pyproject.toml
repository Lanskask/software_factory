[project]
name = "software-factory"
version = "0.1.0"
description = "Plan a Project with the Owner, then implement its Tickets unattended, one Claude Code session each."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
